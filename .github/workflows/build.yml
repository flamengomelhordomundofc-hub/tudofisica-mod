name: Compilar Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Extrair arquivos do mod
        run: unzip -o tudofisica-source.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar Mod
        run: gradle build -Dorg.gradle.jvmargs=-Xmx3G

      - name: Salvar arquivo do Mod
        uses: actions/upload-artifact@v4
        with:
          name: tudofisica-mod-1.20.1
          path: build/libs/*.jar
